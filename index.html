<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #e0f2fe;
            background-image: radial-gradient(#bae6fd 3px, transparent 3px);
            background-size: 40px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            position: relative; /* เพิ่มเพื่อให้ปุ่มแอดมินอิงตำแหน่งมุมขวาบนของหน้าจอ */
        }

        /* 👨‍🏫 ปุ่มระบบหลังบ้านของคุณครู มุมขวาบน */
        .btn-admin {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #fbbf24;
            color: #78350f;
            border: 3px solid #f59e0b;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 15px;
            cursor: pointer;
            font-family: 'Kanit', sans-serif;
            box-shadow: 0 4px 0px #d97706;
            transition: 0.2s;
            z-index: 100;
        }

        .btn-admin:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px #d97706;
        }


        .login-box {
            background: white;
            padding: 40px;
            border-radius: 25px;
            border: 5px solid #38bdf8;
            box-shadow: 0 10px 0px #7dd3fc;
            text-align: center;
            width: 90%;
            max-width: 450px;
        }

        .logo-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            color: #0284c7;
            margin-top: 0;
            font-weight: 800;
            font-size: 28px;
        }

        .section-label {
            text-align: left;
            font-weight: 800;
            color: #0369a1;
            margin: 15px 0 5px 5px;
            font-size: 16px;
        }

        .input-login {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 3px solid #bae6fd;
            border-radius: 15px;
            outline: none;
            font-family: 'Kanit';
            font-weight: 600;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        .input-login:focus {
            border-color: #38bdf8;
        }

        .names-container {
            background: #f0f9ff;
            padding: 15px;
            border-radius: 18px;
            border: 2px dashed #7dd3fc;
            margin-bottom: 20px;
        }

        .btn-login {
            background: #4ade80;
            color: #14532d;
            border: none;
            padding: 15px;
            font-size: 20px;
            font-weight: 800;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 0px #16a34a;
            font-family: 'Kanit';
            width: 100%;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-login:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px #16a34a;
        }

        /* ปรับตำแหน่งปุ่มเมื่อดูบนมือถือ ไม่ให้บังกล่องล็อกอิน */
        @media (max-width: 600px) {
            body {
                flex-direction: column;
                justify-content: flex-start;
                padding-top: 80px;
            }
            .btn-admin {
                font-size: 14px;
                padding: 8px 15px;
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>

    <button class="btn-admin" onclick="adminLogin()">👨‍🏫 ระบบหลังบ้าน (ครู)</button>

    <div class="login-box">
        <div class="logo-icon">🌱💧</div>
        <h1>เข้าสู่สวนแสนสุข (แบบกลุ่ม)</h1>
        <p style="color: #64748b; margin-bottom: 20px;">เลือกห้องเรียน และพิมพ์ชื่อเล่นของทุกคนในเครื่องนี้เลยกั๊บ!</p>

        <div class="section-label">🏫 1. เลือกห้องเรียนของหนู:</div>
        <select id="classroom" class="input-login" style="cursor: pointer; text-align-last: center;">
            <option value="" disabled selected>-- กดเลือกห้องเรียนตรงนี้กั๊บ --</option>
            <option value="ป.4/1">ห้อง ป.4/1</option>
            <option value="ป.4/2">ห้อง ป.4/2</option>
            <option value="ป.4/3">ห้อง ป.4/3</option>
        </select>

        <div class="section-label">👧👦 2. พิมพ์ชื่อเล่นของสมาชิก (1-3 คน):</div>
        <div class="names-container">
            <input type="text" id="name1" class="input-login" placeholder="👤 คนที่ 1 (ชื่อเล่น)...">
            <input type="text" id="name2" class="input-login" placeholder="👤 คนที่ 2 (ถ้าไม่มีไม่ต้องพิมพ์)...">
            <input type="text" id="name3" class="input-login" placeholder="👤 คนที่ 3 (ถ้าไม่มีไม่ต้องพิมพ์)...">
        </div>

        <button class="btn-login" id="btnLogin" onclick="loginGroup()">เข้าสู่สวนแสนสุข 🚀</button>
    </div>

    <script>
        // ✅ นำ Config ของคุณครูมาใส่ให้เรียบร้อยแล้วครับ
        const firebaseConfig = {
            apiKey: "AIzaSyDfBIp5gujB9cE2twLz483hllYOubgYuks",
            authDomain: "codingplant-f19fc.firebaseapp.com",
            projectId: "codingplant-f19fc",
            storageBucket: "codingplant-f19fc.firebasestorage.app",
            messagingSenderId: "194545106875",
            appId: "1:194545106875:web:d4b7ca3dd6b57f46cc8e9e",
            measurementId: "G-Y6C9LXKJ1H"
        };

        // เริ่มต้นการทำงานของ Firebase
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 👨‍🏫 ฟังก์ชันระบบหลังบ้านของคุณครู
        function adminLogin() {
            let pass = prompt("กรุณาใส่รหัสผ่านสำหรับคุณครู เพื่อเข้าสู่ระบบหลังบ้าน:");
            
            if (pass === "587520") {
                // หมายเหตุ: เป็น session guard เชิงการใช้งานเท่านั้น ไม่ใช่ระบบความปลอดภัยแทน Firebase Auth
                localStorage.setItem("currentRole", "admin");
                localStorage.setItem("role", "admin");
                localStorage.setItem("isAdmin", "true");
                localStorage.setItem("currentTeacherName", "Teacher");
                alert("✅ ยินดีต้อนรับคุณครูครับ!");
                window.location.href = "admin.html";
            } else if (pass !== null && pass !== "") {
                alert("❌ รหัสผ่านไม่ถูกต้องกั๊บ ลองใหม่อีกครั้งนะ!");
            }
        }
        // =========================================================
        // 🪙 ระบบเข้าสู่ระบบกลุ่มและสร้างกระเป๋าเหรียญเวทมนตร์
        // =========================================================
        function makeSafeUserId(room, name) {
            const safeRoom = room.replace(/\//g, "-");
            return `${safeRoom}_${name.trim()}`;
        }

        function makeNewGroupId(userIds) {
            const sorted = [...userIds].sort((a, b) => a.localeCompare(b, "th"));
            return encodeURIComponent(sorted.join("__"));
        }

        function timestampToMillis(value) {
            if (!value) return 0;
            if (typeof value.toMillis === "function") return value.toMillis();
            if (value.seconds) return value.seconds * 1000;
            return 0;
        }

        function chooseCanonicalWallet(walletDocs) {
            /*
              ข้อมูลเก่าบางคนอาจถูกสร้างกระเป๋าซ้ำ เช่น
              - กระเป๋ากลุ่มเดิม มีสมาชิกหลายคนและเหรียญถูกใช้ไปแล้ว
              - กระเป๋าเดี่ยวที่ถูกสร้างใหม่ มี 100 เหรียญ

              หลักเลือกกระเป๋าหลัก:
              1) จำนวนสมาชิกมากที่สุด = มีแนวโน้มเป็นกระเป๋ากลุ่มจริง
              2) ถ้าเท่ากัน เลือกเหรียญน้อยกว่า = รักษายอดที่ถูกใช้จริง
              3) ถ้ายังเท่ากัน เลือกรายการที่อัปเดตล่าสุด
            */
            return [...walletDocs].sort((a, b) => {
                const aData = a.data() || {};
                const bData = b.data() || {};
                const memberDiff = (bData.memberIds || []).length - (aData.memberIds || []).length;
                if (memberDiff !== 0) return memberDiff;

                const aCoins = Number.isFinite(Number(aData.magicCoins)) ? Number(aData.magicCoins) : 100;
                const bCoins = Number.isFinite(Number(bData.magicCoins)) ? Number(bData.magicCoins) : 100;
                if (aCoins !== bCoins) return aCoins - bCoins;

                const aUpdated = timestampToMillis(aData.updatedAt || aData.lastLoginAt || aData.createdAt);
                const bUpdated = timestampToMillis(bData.updatedAt || bData.lastLoginAt || bData.createdAt);
                return bUpdated - aUpdated;
            })[0];
        }

        async function findWalletIdForUser(userId, userData) {
            // ตรวจว่ารหัสกระเป๋าที่บันทึกไว้ยังมีอยู่จริงก่อนใช้งาน
            if (userData && userData.groupWalletId) {
                const linkedWallet = await db.collection("group_wallets")
                    .doc(userData.groupWalletId)
                    .get();

                if (linkedWallet.exists) {
                    return linkedWallet.id;
                }
            }

            // รองรับข้อมูลเก่า: ค้นหาทุกกระเป๋าที่มีรหัสนักเรียนคนนี้
            const oldWalletQuery = await db.collection("group_wallets")
                .where("memberIds", "array-contains", userId)
                .get();

            if (oldWalletQuery.empty) return null;

            // ถ้ามีหลายกระเป๋า ให้เลือกกระเป๋ากลุ่มจริงอัตโนมัติ ไม่หยุดการเข้าสู่ระบบ
            const canonicalWallet = chooseCanonicalWallet(oldWalletQuery.docs);
            return canonicalWallet.id;
        }

        // =========================================================
        // 🌱 Migration คะแนนจากแปลงปลูกต้นไม้ระบบเดิม (localStorage)
        // ใช้เฉพาะตอนที่ยังไม่มี users/{userId} ใน Firestore
        // =========================================================
        function normalizeLegacyName(name = "") {
            return String(name)
                .trim()
                .replace(/\s+/g, " ")
                .toLocaleLowerCase("th");
        }

        function normalizeLegacyRoom(room = "") {
            const text = String(room).trim();
            // ป.4/1, ห้อง 4/1, 4/1 -> 4/1
            const match = text.match(/(\d+)\s*\/\s*(\d+)/);
            if (match) return `${Number(match[1])}/${Number(match[2])}`;
            return text
                .replace(/^ห้อง\s*/i, "")
                .replace(/^ป\.?\s*/i, "")
                .replace(/\s+/g, "")
                .toLocaleLowerCase("th");
        }

        function findLegacyGardenStudent(room, nickname) {
            try {
                const legacy = JSON.parse(
                    localStorage.getItem("multiRoomGardenData") || "null"
                );

                if (!legacy || !legacy.rooms || typeof legacy.rooms !== "object") {
                    return null;
                }

                const wantedRoom = normalizeLegacyRoom(room);
                const wantedName = normalizeLegacyName(nickname);

                // หา key ห้องที่ตรงกันก่อน เช่น ป.4/1 = ห้อง 4/1
                const roomKey = Object.keys(legacy.rooms).find(
                    key => normalizeLegacyRoom(key) === wantedRoom
                );

                if (!roomKey || !Array.isArray(legacy.rooms[roomKey])) {
                    return null;
                }

                const student = legacy.rooms[roomKey].find(
                    item => normalizeLegacyName(item?.name) === wantedName
                );

                if (!student) return null;

                return {
                    roomKey,
                    name: String(student.name || nickname).trim(),
                    water: Math.max(0, Number(student.water) || 0),
                    legacyId: student.id || ""
                };
            } catch (error) {
                console.warn("อ่านข้อมูลแปลงเดิมเพื่อ Migration ไม่สำเร็จ:", error);
                return null;
            }
        }

        // =========================================================
        // 🔎 ค้นหานักเรียนเดิมจากห้อง + ชื่อเล่นแบบไม่พึ่ง Composite Index
        // ช่วยให้ล็อกอินได้แม้ผู้เรียนเคยเปลี่ยนชื่อในหน้าโปรไฟล์
        // =========================================================
        async function findExistingUserByRoomAndNickname(room, nickname) {
            const wanted = normalizeLegacyName(nickname);
            try {
                const roomSnapshot = await db.collection("users")
                    .where("room", "==", room)
                    .get();

                const matches = roomSnapshot.docs.filter(doc => {
                    const data = doc.data() || {};
                    return normalizeLegacyName(data.nickname || "") === wanted;
                });

                if (matches.length > 1) {
                    throw new Error(`พบชื่อ ${nickname} ซ้ำใน ${room} กรุณาให้คุณครูตรวจรายชื่อ`);
                }
                return matches[0] || null;
            } catch (error) {
                console.warn("ค้นหานักเรียนเดิมจากห้องไม่สำเร็จ:", error);
                throw error;
            }
        }

        // =========================================================
        // 🪙 เข้าสู่ระบบโดยผูกนักเรียนกับกระเป๋ากลุ่มถาวร
        // =========================================================
        async function loginGroup() {
            const btn = document.getElementById("btnLogin");
            const room = document.getElementById("classroom").value;
            const activeNames = [
                document.getElementById("name1").value.trim(),
                document.getElementById("name2").value.trim(),
                document.getElementById("name3").value.trim()
            ].filter(Boolean);

            if (!room) {
                alert("อย่าลืมเลือกห้องเรียนก่อนนะกั๊บ! 🏫");
                return;
            }
            if (!activeNames.length) {
                alert("อย่างน้อยต้องพิมพ์ชื่อเล่น 1 คนนะกั๊บ! 📝");
                return;
            }

            const normalizedNames = activeNames.map(name => normalizeLegacyName(name));
            if (new Set(normalizedNames).size !== activeNames.length) {
                alert("พบชื่อสมาชิกซ้ำกัน กรุณาตรวจสอบชื่ออีกครั้งนะกั๊บ! 👥");
                return;
            }

            // นักเรียนล็อกอินใหม่ ให้ยกเลิก session ครูเดิม
            localStorage.setItem("currentRole", "student");
            localStorage.setItem("role", "student");
            localStorage.removeItem("isAdmin");
            localStorage.removeItem("currentTeacherName");

            // บัญชีช่วยเหลือพิเศษ Kru_Mild
            const isKruMild = activeNames.some(name => name.toLowerCase() === "kru_mild");
            if (isKruMild) {
                if (activeNames.length !== 1 || activeNames[0].toLowerCase() !== "kru_mild") {
                    alert("Kru_Mild เป็นบัญชีพิเศษ กรุณาล็อกอินชื่อ Kru_Mild เพียงชื่อเดียว");
                    return;
                }
                localStorage.removeItem("groupWalletId");
                localStorage.removeItem("currentUserId");
                localStorage.removeItem("isAdmin");
                localStorage.removeItem("currentTeacherName");
                localStorage.setItem("currentRole", "helper");
                localStorage.setItem("role", "helper");
                localStorage.setItem("currentRoom", room);
                localStorage.setItem("currentUserName", "Kru_Mild");
                localStorage.setItem("currentGroupNames", JSON.stringify(["Kru_Mild"]));
                localStorage.setItem("loggedInUsers", JSON.stringify(["KRU_MILD_HELPER"]));
                localStorage.setItem("currentGroupId", "KRU_MILD_HELPER");
                btn.disabled = true;
                btn.innerText = "✅ เข้าสู่ระบบแล้ว กำลังเปิดหน้าแลกเปลี่ยน...";
                setTimeout(() => window.location.replace("share.html"), 150);
                return;
            }

            btn.disabled = true;
            btn.innerText = "กำลังเข้าสู่สวน... ⏳";

            try {
                const userRecords = [];
                const userIds = [];
                const discoveredWalletIds = new Set();

                // 1) หานักเรียนเดิมก่อน เพื่อรักษาคะแนน/ของ/Reflection เดิม
                for (let i = 0; i < activeNames.length; i++) {
                    const typedName = activeNames[i];
                    const candidateId = makeSafeUserId(room, typedName);
                    let userRef = db.collection("users").doc(candidateId);
                    let userSnap = await userRef.get();

                    if (!userSnap.exists) {
                        const existing = await findExistingUserByRoomAndNickname(room, typedName);
                        if (existing) {
                            userSnap = existing;
                            userRef = existing.ref;
                        }
                    }

                    const userId = userRef.id;
                    const userData = userSnap.exists ? (userSnap.data() || {}) : null;
                    const walletId = await findWalletIdForUser(userId, userData);
                    const legacyStudent = !userSnap.exists
                        ? findLegacyGardenStudent(room, typedName)
                        : null;

                    if (walletId) discoveredWalletIds.add(walletId);
                    userIds.push(userId);
                    userRecords.push({
                        userId,
                        nickname: typedName,
                        userRef,
                        userSnap,
                        userData,
                        walletId,
                        legacyStudent
                    });
                }

                if (discoveredWalletIds.size > 1) {
                    throw new Error(
                        "สมาชิกที่กรอกอยู่คนละกลุ่มเดิม กรุณาเข้าสู่ระบบแยกตามกลุ่มเดิม หรือให้คุณครูจัดกลุ่มใหม่ในหลังบ้าน"
                    );
                }

                const existingWalletId = Array.from(discoveredWalletIds)[0] || null;
                const groupId = existingWalletId || makeNewGroupId(userIds);
                const walletRef = db.collection("group_wallets").doc(groupId);
                const walletSnap = await walletRef.get();
                const now = firebase.firestore.FieldValue.serverTimestamp();
                const batch = db.batch();

                let allMemberIds = [...userIds];
                let allMemberNames = [...activeNames];
                let isBrandNewWallet = !walletSnap.exists;

                if (walletSnap.exists) {
                    const walletData = walletSnap.data() || {};
                    allMemberIds = Array.from(new Set([
                        ...(Array.isArray(walletData.memberIds) ? walletData.memberIds : []),
                        ...userIds
                    ]));
                    const nameById = new Map();
                    const oldIds = Array.isArray(walletData.memberIds) ? walletData.memberIds : [];
                    const oldNames = Array.isArray(walletData.memberNames) ? walletData.memberNames : [];
                    oldIds.forEach((id, idx) => nameById.set(id, oldNames[idx] || id));
                    userIds.forEach((id, idx) => nameById.set(id, activeNames[idx]));
                    allMemberNames = allMemberIds.map(id => nameById.get(id) || id);

                    batch.set(walletRef, {
                        room,
                        memberIds: allMemberIds,
                        memberNames: allMemberNames,
                        updatedAt: now,
                        lastLoginAt: now
                    }, { merge:true });
                } else {
                    batch.set(walletRef, {
                        groupId,
                        room,
                        memberIds: allMemberIds,
                        memberNames: allMemberNames,
                        magicCoins: 100,
                        purchasedHints: [],
                        inventory: [],
                        createdAt: now,
                        updatedAt: now,
                        lastLoginAt: now
                    }, { merge:true });
                }

                // 2) ผูก user กับ wallet โดยไม่แตะ waterDrops ของคนเดิม
                for (const record of userRecords) {
                    const baseData = {
                        room,
                        nickname: record.nickname,
                        groupWalletId: groupId,
                        lastLoginAt: now,
                        updatedAt: now
                    };

                    if (record.userSnap.exists) {
                        batch.set(record.userRef, baseData, { merge:true });
                    } else {
                        const migratedWater = record.legacyStudent
                            ? Math.max(0, Number(record.legacyStudent.water) || 0)
                            : 0;
                        batch.set(record.userRef, {
                            ...baseData,
                            avatar: "👤",
                            waterDrops: migratedWater,
                            createdAt: now,
                            migratedFromLegacyGarden: Boolean(record.legacyStudent),
                            legacyGardenRoom: record.legacyStudent ? (record.legacyStudent.roomKey || "") : "",
                            legacyGardenName: record.legacyStudent ? (record.legacyStudent.name || "") : "",
                            legacyGardenWater: migratedWater,
                            migratedAt: record.legacyStudent ? now : null
                        }, { merge:true });
                    }
                }

                await batch.commit();

                // 3) บันทึก session ก่อนเปลี่ยนหน้า
                // บันทึกทั้ง key รุ่นใหม่และ key เดิม เพื่อให้ทุกหน้าของเว็บอ่านได้ตรงกัน
                localStorage.setItem("currentRoom", room);
                localStorage.setItem("loggedInUsers", JSON.stringify(userIds));
                localStorage.setItem("currentGroupId", groupId);
                localStorage.setItem("groupWalletId", groupId);
                localStorage.setItem("currentGroupNames", JSON.stringify(activeNames));
                localStorage.setItem("currentRole", "student");
                localStorage.setItem("role", "student");
                localStorage.setItem("currentUserId", userIds[0] || "");
                localStorage.setItem("currentUserName", activeNames[0] || "");
                localStorage.setItem("gardenSessionReady", "1");

                // เก็บสำรองใน sessionStorage ด้วย เผื่อบางเบราว์เซอร์อ่าน localStorage ช้าหรือมีข้อมูลเก่าค้าง
                try {
                    sessionStorage.setItem("gardenSessionBackup", JSON.stringify({
                        currentRoom: room,
                        loggedInUsers: userIds,
                        currentGroupId: groupId,
                        currentGroupNames: activeNames,
                        currentRole: "student"
                    }));
                } catch (storageError) {
                    console.warn("ไม่สามารถบันทึก session สำรองได้:", storageError);
                }

                // ตรวจซ้ำก่อนออกจากหน้า Login ถ้าบันทึก session ไม่ครบจะไม่เด้งไปหน้าอื่นแบบเงียบ ๆ
                let savedUsers = [];
                try {
                    savedUsers = JSON.parse(localStorage.getItem("loggedInUsers") || "[]");
                } catch (e) {
                    savedUsers = [];
                }
                const savedRoom = localStorage.getItem("currentRoom") || "";
                const savedGroupId = localStorage.getItem("currentGroupId") || "";

                if (!Array.isArray(savedUsers) || !savedUsers.length || !savedRoom || !savedGroupId) {
                    throw new Error("บันทึกข้อมูลการเข้าสู่ระบบไม่ครบ กรุณาลองใหม่อีกครั้ง");
                }

                btn.innerText = isBrandNewWallet
                    ? "✅ สำเร็จ! สร้างกระเป๋า 100 เหรียญแล้ว"
                    : "✅ สำเร็จ! กำลังเปิดหน้า Home...";

                // ใส่เวอร์ชันท้าย URL เพื่อป้องกันเบราว์เซอร์ใช้ home.html เก่าจาก cache
                window.location.href = "home.html?v=20260909-loginfix2";

            } catch (error) {
                console.error("Login error:", error);
                alert(
                    "เข้าสู่ระบบไม่สำเร็จ 😢\n\n" +
                    (error && error.message ? error.message : String(error)) +
                    "\n\nถ้ายังเกิดซ้ำ กรุณาแคปหน้าจอข้อความนี้ส่งมาให้ฉัน"
                );
                btn.disabled = false;
                btn.innerText = "เข้าสู่สวนแสนสุข 🚀";
            }
        }

        
    </script>
</body>
</html>
